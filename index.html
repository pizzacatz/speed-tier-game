<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#18181b" />
  <meta name="description" content="Who moves first? A Pokémon Champions Reg M-C speed tier trainer." />
  <link rel="icon" href="/speed-tier-game/icon.svg" type="image/svg+xml" />
  <title>Speed Tier Game</title>
</head>
<body>
  <header>
    <h1>Speed Tier Game</h1>
    <div class="score" aria-live="polite"><span>Streak <b id="streak">0</b></span><span>Best <b id="best">0</b></span></div>
    <button id="open-settings" aria-label="Settings">⚙</button>
  </header>
  <nav class="modes" aria-label="Game">
    <a id="mode-moves" href="#moves">Who moves first?</a>
    <a id="mode-howfast" href="#howfast">How fast?</a>
  </nav>
  <button id="meta" class="meta-btn" type="button" aria-label="Change list"></button>
  <p id="field" class="field"></p>
  <section id="howfast" hidden>
    <form id="hf-form" class="hf">
      <div id="hf-card" class="card"></div>
      <label for="hf-input">Speed stat (base + 20)</label>
      <input id="hf-input" type="number" inputmode="numeric" autocomplete="off" min="1" max="300" required />
      <button id="hf-submit">Submit <kbd>Enter</kbd></button>
    </form>
  </section>
  <main id="board">
    <button class="card" id="card-a" data-pick="a"></button>
    <button class="card" id="card-b" data-pick="b"></button>
    <button class="tie" id="tie" data-pick="tie">Speed tie <kbd>↓</kbd></button>
  </main>
  <section id="result" hidden aria-live="polite"></section>

  <dialog id="settings">
    <form method="dialog" class="settings">
      <h2>Settings</h2>
      <label class="row">List <select id="list"></select></label>
      <fieldset>
        <legend>Stats</legend>
        <label class="row"><input type="checkbox" id="natures" /> Stat alignments (natures)</label>
        <label class="row"><input type="checkbox" id="investment" /> Max / Min Speed (SP)</label>
        <p class="meta">Turn both off for unmodified speed (base + 20).</p>
      </fieldset>
      <fieldset>
        <legend>Effects</legend>
        <div id="effects"></div>
        <button type="button" id="chaos">Chaos: all on</button>
        <button type="button" id="calm">All off</button>
      </fieldset>
      <label class="row"><input type="checkbox" id="close" /> Close mode (final speeds within 10)</label>
      <fieldset>
        <legend>Custom lists</legend>
        <div class="row">
          <input id="cl-name" placeholder="List name" />
          <button type="button" id="cl-delete">Delete</button>
        </div>
        <input id="cl-search" type="search" placeholder="Search Pokémon" />
        <p id="cl-count"></p>
        <p id="cl-error" class="error" role="alert" hidden></p>
        <div id="cl-mons" class="mons"></div>
        <button type="button" id="cl-save">Save list</button>
      </fieldset>
      <p class="meta" id="data-info"></p>
      <button value="close" class="done">Done</button>
    </form>
  </dialog>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
